name: Codex Fork Preflight

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Contribution commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Code formatting and linting
        run: just lint $UV_PYTHON
      - name: Unit testing
        run: just unit-tests $UV_PYTHON

  code-assessments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v4
      - name: Code audits
        run: just audit
